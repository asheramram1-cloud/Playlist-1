name: Update M3U Playlist

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download M3U from external site
        run: |
          # שימוש ב-User-Agent של דפדפן ומעקב אחרי הפניות (-L)
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "http://m3u4u.com/m3u/5z3end2e22fpp7kmnqpk" -o playlist.m3u

          # בדיקה שהקובץ אינו ריק
          if [ ! -s playlist.m3u ]; then
            echo "הורדת הקובץ נכשלה או שהקובץ הוחזר ריק!"
            exit 1
          fi

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Auto-update playlist" || exit 0
          git push
