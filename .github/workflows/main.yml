name: Update M3U Playlist

on:
  schedule:
    # הרצה אוטומטית בכל יום בחצות (ניתן לשינוי)
    - cron: '0 0 * * *'
  # מאפשר הרצה ידנית בלחיצת כפתור בלשונית Actions
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Format M3U
        run: |
          # 1. הגדרת משתנים - החלף בקישורים הנדרשים
          EPG_URL"https://www.dropbox.com/scl/fi/61c8yrht5ld5cw4xcmpab/m3u4u-206621-742024-Playlist-World.m3u?rlkey=btda0hu1ew1cz8w9z6pzb7p9o&st=jj79yg94&dl=1"
          M3U_SOURCE_URL=st="https://www.dropbox.com/scl/fi/ar5cuoacjobt717731e03/m3u4u-206621-742024-Playlist-World-1.m3u?rlkey=ju5sv9bbejsxobkak2dbs8nct&st=c0khvw18&dl=1"
          OUTPUT_FILE="world2.m3u"

          # 2. הורדת קובץ ה-M3U המקורי לקובץ זמני
          curl -sL "$M3U_SOURCE_URL" -o temp.m3u

          # 3. הסרת שורת #EXTM3U קיימת מהקובץ המקורי (אם היא קיימת בראש הקובץ)
          sed -i '/^#EXTM3U/d' temp.m3u

          # 4. יצירת הקובץ החדש עם שורת x-tvg-url בראשו ושרשור שאר הערוצים
          echo "#EXTM3U x-tvg-url=\"$EPG_URL\"" > "$OUTPUT_FILE"
          cat temp.m3u >> "$OUTPUT_FILE"

          # 5. ניקוי קובץ זמני
          rm temp.m3u

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add playlist.m3u
          
          # ביצוע Commit רק אם חל שינוי בתוכן הערוצים
          if git diff --staged --quiet; then
            echo "No changes found in M3U playlist."
          else
            git commit -m "Automated update of M3U playlist and EPG header"
            git push
          fi
