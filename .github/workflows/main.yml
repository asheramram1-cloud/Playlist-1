name: Update M3U Playlist

on:
  workflow_dispatch:
    inputs:
      m3u_url:
        description: '×§×™×©×•×¨ ×œ×ž×§×•×¨ ×”-M3U'
        required: false
        type: string
      tvg_url:
        description: '×§×™×©×•×¨ ×œ-EPG (x-tvg-url)'
        required: false
        type: string
  schedule:
    - cron: '0 */6 * * *'   # ×›×œ 6 ×©×¢×•×ª, ××¤×©×¨ ×œ×©× ×•×ª - ×™×¨×•×¥ ×¢× ×”×¢×¨×›×™× ×©×©×ž×•×¨×™× ×‘-Repo Variables

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build playlist
        env:
          # ×¡×“×¨ ×¢×“×™×¤×•×™×•×ª: ×ž×” ×©×”×•×“×‘×§ ×‘-Run workflow > Repo Variables > config.txt
          M3U_URL: ${{ inputs.m3u_url || vars.M3U_URL }}
          TVG_URL: ${{ inputs.tvg_url || vars.TVG_URL }}
        run: python scripts/build_playlist.py

      - name: Verify header exists
        run: |
          head -n 1 playlist.m3u
          if ! head -n 1 playlist.m3u | grep -q 'x-tvg-url='; then
            echo "::error::x-tvg-url ×—×¡×¨ ×‘×©×•×¨×” ×”×¨××©×•× ×” - ×¢×•×¦×¨ ×œ×¤× ×™ commit"
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          if git diff --cached --quiet; then
            echo "××™×Ÿ ×©×™× ×•×™×™×"
          else
            git commit -m "Auto-update playlist ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
